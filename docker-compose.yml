services:
  editor:
    build: .
    image: multicam-editor:latest
    container_name: multicam-editor
    ports:
      - "8000:8000"
    volumes:
      - editor-data:/srv/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;\
        sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  editor-data:
