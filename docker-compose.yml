services:
  editor:
    build: .
    image: multicam-editor:latest
    container_name: multicam-editor
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/api/state').status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 3s
      retries: 5
